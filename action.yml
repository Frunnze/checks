name: checks
description: Run the checks toolkit on the calling repository, configured by its checks.toml
inputs:
  stage:
    description: Which checks to run - ci runs every enabled check over the whole repository
    default: ci
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install gitleaks
      shell: bash
      run: |
        gitleaks_release="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
        curl -sSfL "$gitleaks_release" | tar -xz -C "$RUNNER_TEMP" gitleaks
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
    - name: Install the toolkit
      shell: bash
      run: "$GITHUB_ACTION_PATH/install.sh"
    - name: Run the checks
      shell: bash
      run: '"$GITHUB_ACTION_PATH/run" --stage "${{ inputs.stage }}"'
